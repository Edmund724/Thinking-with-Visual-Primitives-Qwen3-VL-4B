# Stage 2: GRPO (Group Relative Policy Optimization)
# Uses TRL's GRPOTrainer with multimodal support.
# 3 rounds with tightening reward thresholds on single RTX 5090D (24GB).
#
# NOTE: When loading from an adapter checkpoint (e.g., Stage 1 output),
# lora_r / lora_alpha / lora_dropout are READ from the saved adapter config,
# NOT from this YAML. To change LoRA dimensions, start from base_model directly.
#
# NOTE: num_samples_per_round controls COCO sample count only.
# Maze and path samples are generated proportionally:
#   maze = max(1000, num_samples // 2)
#   path = max(500, num_samples // 5)
#
# NOTE: num_generations=5 is the LIMIT for 24GB single-card.
# Each generation produces up to max_completion_length tokens;
# KV cache for 5 concurrent generations is the main memory bottleneck.

base_model: ./models/Qwen3-VL-4B-Thinking
stage1_checkpoint: outputs/stage1_sft_unified
output_dir: outputs/stage2_grpo
max_completion_length: 1024
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
num_train_epochs: 1
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 50
logging_steps: 5
save_steps: 200
save_total_limit: 2
gradient_checkpointing: true
report_to: none
# GRPO-specific
num_generations: 5
beta: 0.04
temperature: 1.0
scale_rewards: group
# Round thresholds (tightening schedule)
# R1: learn rough alignment -> R3: enforce precise coordinates
num_rounds: 3
num_samples_per_round: 5000
iou_thresholds: [0.3, 0.5, 0.7]
point_dist_thresholds: [20.0, 10.0, 5.0]
