# Stage 0.5: Visual Pretrain
base_model: models/Qwen3-VL-4B-Thinking
stage0_pretrain: outputs/stage0_pretrain
output_dir: outputs/stage0_5_visual_pretrain
max_seq_length: 2048
per_device_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-6
num_train_epochs: 2
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 100
logging_steps: 50
save_steps: 500
save_total_limit: 3
gradient_checkpointing: true
report_to: none
num_box_samples: 50000
num_point_samples: 10000