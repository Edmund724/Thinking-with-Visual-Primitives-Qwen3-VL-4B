# Stage 4b: Specialized GRPO — Point Expert
model_path: outputs/stage3b_sft_point
output_dir: outputs/stage4b_grpo_point
coco_image_dir: data/coco/train2017
coco_ann_file: data/coco/annotations/instances_train2017.json
max_completion_length: 512
batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-6
num_epochs: 1
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
