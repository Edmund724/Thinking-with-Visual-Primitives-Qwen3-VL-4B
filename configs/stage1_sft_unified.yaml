# Stage 1: SFT Unified
base_model: ./models/Qwen3-VL-4B-Thinking
output_dir: outputs/stage1_sft_unified
max_seq_length: 2048
per_device_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 100
logging_steps: 10
save_steps: 500
save_total_limit: 3
gradient_checkpointing: true
report_to: none
# Data sizes
num_coco_samples: 40000
num_maze_samples: 50000
num_path_samples: 15000
