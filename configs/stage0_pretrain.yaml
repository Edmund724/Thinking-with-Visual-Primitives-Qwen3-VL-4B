# Stage 0: Pretrain — COCO Box Grounding (No Thinking Chain)
# Following DeepSeek "Thinking with Visual Primitives" curriculum:
#   Stage 0: learn "hand movement" — output box coordinates without reasoning
#   Stage 1: learn "when and how to think" — add Chain-of-Thought
#
# Goal: Model learns stable coordinate output BEFORE adding thinking overhead.
# Only COCO box data. No maze, no path, no <think> chain (pure grounding).

base_model: ./models/Qwen3-VL-4B-Thinking
output_dir: outputs/stage0_pretrain
max_seq_length: 2048
per_device_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 100
logging_steps: 10
save_steps: 200
save_total_limit: 3
gradient_checkpointing: true
report_to: none
# Pretrain only needs COCO box grounding
num_coco_samples: 40000
