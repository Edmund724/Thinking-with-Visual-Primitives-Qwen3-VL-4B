bf16: true
warmup_steps: 50
logging_steps: 10
save_steps: 200
save_total_limit: 2
gradient_checkpointing: true
report_to: none
num_point: 1000
num_maze: 2000
num_path: 1000
num_rounds: 2
num_generations: 2
beta: 0.04
temperature: 1.0
filter_batch_size: 4
filter_empty_cache_every: 50
skip_difficulty_filter: false
use_quality_rm_api: false
compile_model: false
early_stopping_subset_size: 16
early_stopping_eval_steps: 50
early_stopping_patience: 2
