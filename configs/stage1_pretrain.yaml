# Stage 1: Text + Visual Pretrain (embedding-only)
model_path: models/Qwen3-VL-4B-Thinking
output_dir: outputs/stage1_pretrain
data_path: data/pretrain/pretrain_data.json
num_samples: 30000
num_epochs: 3
learning_rate: 2.0e-4
batch_size: 4
gradient_accumulation_steps: 1
max_length: 256
max_seq_length: 2048
warmup_steps: 100
coco_grounding_ratio: 0.0
curriculum: true
# Visual grounding pretrain (disabled by default; set visual_data_ratio > 0 to enable)
visual_data_ratio: 0.0
coco_image_dir: data/coco/train2017
visual_num_box: 5000
visual_num_point: 2000
visual_epochs: 1
visual_learning_rate: 5.0e-5
visual_batch_size: 1
visual_gradient_accumulation_steps: 4
# ViT unfreezing
unfreeze_vit_layers: 0
vit_lr: 1.0e-6
