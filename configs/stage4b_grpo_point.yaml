# Stage 4b: Specialized GRPO — Point Expert
model_path: outputs/stage3b_sft_point
output_dir: outputs/stage4b_grpo_point
coco_image_dir: data/coco/train2017
coco_ann_file: data/coco/annotations/instances_train2017.json
max_completion_length: 512
batch_size: 3
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
num_epochs: 1
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 50
logging_steps: 10
save_steps: 200
save_total_limit: 2
gradient_checkpointing: true
report_to: tensorboard
num_point: 2000
num_maze: 4000
num_path: 2000
num_rounds: 2
num_generations: 6
generation_batch_size: 6
beta: 0.04
temperature: 1.0
filter_batch_size: 6
filter_max_completion_length: 512
filter_point_dist_threshold: 20.0
filter_reward_threshold: null
filter_empty_cache_every: 50
skip_difficulty_filter: true
use_quality_rm_api: false
compile_model: false
early_stopping_subset_size: 16
early_stopping_eval_steps: 50
early_stopping_patience: 2
