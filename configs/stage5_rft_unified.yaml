# Stage 5: Unified RFT (Experts as Generators)
model_path: outputs/stage2_merged_base
stage2_merged_base: outputs/stage2_merged_base
box_expert_path: outputs/stage4a_grpo_box
point_expert_path: outputs/stage4b_grpo_point
output_dir: outputs/stage5_rft_unified
coco_image_dir: data/coco/train2017
coco_ann_file: data/coco/annotations/instances_train2017.json
max_seq_length: 2048
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_epochs: 1
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 100
logging_steps: 10
save_steps: 500
save_total_limit: 3
gradient_checkpointing: true
report_to: tensorboard
num_box_prompts: 4000
num_counting_prompts: 3000
num_clevr_prompts: 2000
num_point_prompts: 3000
num_maze_prompts: 3000
num_path_prompts: 2000
num_rollouts: 5
iou_threshold: 0.5
point_dist_threshold: 10.0
