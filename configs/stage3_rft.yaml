# Stage 3: RFT (Rejection Sampling Fine-Tuning)
# GRPO output -> generate 5 rollouts per sample -> select best by
# process_reward -> SFT on filtered high-quality data.
#
# NOTE: lora_r / lora_alpha / lora_dropout are read from the saved adapter
# config when loading from grpo_checkpoint, NOT from this YAML.
#
# NOTE: accept_threshold (1.2) = answer_correct(1.0) + syntax_valid(0.2).
# Higher scores require additional IoU / point-distance bonuses.
#
# NOTE: rejection_iou_threshold and rejection_point_dist_threshold are
# passed to process_reward()'s matching thresholds (greedy pair matching).
# They do NOT directly control filtering — accept_threshold is the gate.

base_model: ./models/Qwen3-VL-4B-Thinking
grpo_checkpoint: outputs/stage2_grpo/round_3
output_dir: outputs/stage3_rft
max_seq_length: 2048
per_device_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 100
logging_steps: 10
save_steps: 500
save_total_limit: 3
gradient_checkpointing: true
report_to: none
# RFT-specific
num_rollouts: 5
num_coco_samples: 5000
num_maze_samples: 3000
num_path_samples: 2000
accept_threshold: 1.2
rejection_iou_threshold: 0.7
rejection_point_dist_threshold: 10.0
