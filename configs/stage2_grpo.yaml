# Stage 2: GRPO
base_model: ./models/Qwen3-VL-4B-Thinking
stage1_checkpoint: outputs/stage1_sft_unified
output_dir: outputs/stage2_grpo
max_completion_length: 1024
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
num_train_epochs: 1
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 50
logging_steps: 5
save_steps: 200
save_total_limit: 2
gradient_checkpointing: true
report_to: none
# GRPO-specific
num_generations: 5
beta: 0.04
temperature: 1.0
scale_rewards: group
# Round thresholds (tightening schedule)
num_rounds: 3
num_samples_per_round: 5000
iou_thresholds: [0.3, 0.5, 0.7]
point_dist_thresholds: [20.0, 10.0, 5.0]
