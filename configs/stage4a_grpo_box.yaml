# Stage 4a: Specialized GRPO — Box Expert
model_path: outputs/stage3a_sft_box
output_dir: outputs/stage4a_grpo_box
coco_image_dir: data/coco/train2017
coco_ann_file: data/coco/annotations/instances_train2017.json
max_completion_length: 384
batch_size: 2
gradient_accumulation_steps: 3
learning_rate: 1.0e-6
num_epochs: 1
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
optimizer: paged_adamw_8bit
bf16: true
warmup_steps: 50
logging_steps: 10
save_steps: 200
save_total_limit: 2
gradient_checkpointing: true
report_to: tensorboard
# Smaller default dataset for fast pipeline verification. Scale these back up
# when targeting final accuracy / paper-level performance.
num_samples: 2000
num_counting: 1000
num_clevr: 1000
num_rounds: 1
num_generations: 8
# Reduce rollout memory: each generate call now produces only one group
# (generation_batch_size == num_generations). With batch_size=2 the two
# prompts are generated sequentially, keeping peak VRAM low.
# grad_accum=3 keeps 3 % (1*num_iterations=2) != 0, so GRPO clip_ratio
# remains non-trivial. Effective completions per optimizer step: 2*3*8=48.
generation_batch_size: 8
beta: 0.04
temperature: 1.0
filter_batch_size: 6
filter_max_completion_length: 512
filter_iou_threshold: 0.5
filter_reward_threshold: null
filter_empty_cache_every: 50
skip_difficulty_filter: true
use_quality_rm_api: false
compile_model: false
# Paper-aligned: disable tiny-subset early stopping and train each round to
# convergence over the configured epochs. The callback is skipped when
# early_stopping_subset_size is 0.
early_stopping_subset_size: 0
early_stopping_eval_steps: 50
early_stopping_patience: 2
